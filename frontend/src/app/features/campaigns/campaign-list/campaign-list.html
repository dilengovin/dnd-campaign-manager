<section class="campaign-list">
  <h1>Campaigns</h1>

  @if (campaigns().length === 0) {
    <p class="muted">No campaigns yet. Record the first campaign you run or play in.</p>
  }

  <a routerLink="/campaigns/new" class="cta">Record a campaign</a>

  @if (campaigns().length > 0) {
    <ul class="campaign-cards">
      @for (campaign of campaigns(); track campaign.id) {
        <li class="campaign-card">{{ campaign.name }}</li>
      }
    </ul>
  }
</section>

<section class="campaign-form">
  <h1>Record a campaign</h1>

  <form [formRoot]="campaignForm">
    <label for="name">Name</label>
    <input id="name" type="text" [formField]="campaignForm.name" />

    @if (campaignForm.name().touched() && campaignForm.name().invalid()) {
      <p class="error">{{ campaignForm.name().errors()[0]?.message }}</p>
    }

    <div class="form-actions">
      <button type="submit" [disabled]="campaignForm().invalid()">Record campaign</button>
      <a routerLink="/campaigns" class="cancel">Cancel</a>
    </div>
  </form>
</section>
